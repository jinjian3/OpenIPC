name: Build OpenIPC Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build AP6PCM03
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autotools-dev \
            bc \
            build-essential \
            bison \
            ccache \
            curl \
            flex \
            fzf \
            git \
            libtool \
            libncurses-dev \
            rsync \
            unzip \
            wget \
            whiptail \
            python3 \
            python-is-python3 \
            tree

      - name: Show builder information
        run: |
          echo "===== Builder repository ====="
          git log -1 --oneline
          echo
          echo "===== Devices matching T31ZX / GC4653 / GCA50 / AP6PCM03 ====="
          find devices -type f | grep -Ei 'gca50|ap6pcm03|t31zx|gc4653' || true
          echo
          echo "===== Device directories ====="
          find devices -name '*_defconfig' | sort | grep -Ei 'gca50|ap6pcm03|t31zx|gc4653' || true

      - name: Build GCA50
        run: |
          set -e

          DEVICE="$(find devices -name '*_defconfig' \
            | grep -Ei 'gca50|ap6pcm03' \
            | head -n 1 \
            | sed 's#^.*/##' \
            | sed 's/_defconfig$//')"

          if [ -z "$DEVICE" ]; then
            echo "ERROR: Cannot find GCA50/AP6PCM03 device definition."
            echo
            echo "Available T31ZX devices:"
            find devices -name '*_defconfig' | sort | grep -i t31zx || true
            exit 1
          fi

          echo "========================================"
          echo "Selected device: $DEVICE"
          echo "========================================"

          ./builder.sh "$DEVICE"

      - name: Find firmware images
        run: |
          echo "===== Build output ====="

          find archive -type f -maxdepth 6 \
            \( \
              -name 'uImage.*' \
              -o -name 'rootfs.squashfs.*' \
              -o -name '*.tgz' \
              -o -name 'sizes.*.json' \
            \) \
            -print | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ap6pcm03-gca50
          path: |
            archive/**
          if-no-files-found: error
          retention-days: 30
