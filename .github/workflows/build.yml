
name: Build OpenIPC Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build AP6PCM03
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autotools-dev \
            bc \
            build-essential \
            bison \
            ccache \
            curl \
            flex \
            fzf \
            git \
            libtool \
            libncurses-dev \
            rsync \
            unzip \
            wget \
            whiptail \
            python3 \
            python-is-python3 \
            tree

      - name: Verify AP6PCM03 configuration
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="t31_ultimate_360-ap6pcm03"

          DEFCONFIG="devices/${DEVICE}/br-ext-chip-ingenic/configs/${DEVICE}_defconfig"
          CUSTOMIZER="devices/${DEVICE}/general/overlay/usr/share/openipc/customizer.sh"
          EXCLUDES="devices/${DEVICE}/general/scripts/excludes/t31_ultimate.list"

          echo "===== Builder version ====="
          git log -1 --oneline
          echo

          echo "===== Verify required files ====="

          for FILE in "$DEFCONFIG" "$CUSTOMIZER" "$EXCLUDES"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required file not found: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          echo
          echo "===== Device configuration ====="
          grep -E 'BR2_OPENIPC_(SOC_VENDOR|SOC_MODEL|SOC_FAMILY|SNS_MODEL|VARIANT|FLASH_SIZE)=' "$DEFCONFIG"

          echo
          echo "===== Exclusion list ====="
          cat "$EXCLUDES"

          echo
          echo "===== Customizer ====="
          cat "$CUSTOMIZER"

      - name: Build AP6PCM03
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="t31_ultimate_360-ap6pcm03"

          echo "========================================"
          echo "Building device: $DEVICE"
          echo "========================================"

          ./builder.sh "$DEVICE"

      - name: Find firmware images
        if: always()
        shell: bash
        run: |
          echo "===== Build output ====="

          if [ -d archive ]; then
            find archive -maxdepth 6 -type f \
              \( \
                -name 'uImage.*' \
                -o -name 'rootfs.squashfs.*' \
                -o -name '*.tgz' \
                -o -name 'sizes.*.json' \
              \) -print | sort
          else
            echo "No archive directory found."
          fi

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ap6pcm03
          path: archive/**
          if-no-files-found: error
          retention-days: 30
